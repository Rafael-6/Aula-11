<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário HTML5 Estilizado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form action="/enviar" method="post" class="form-container">
    <h2>Cadastro</h2>

    <div class="form-group">
      <label for="campo-nome">Nome Completo:</label>
      <input type="text" id="campo-nome" name="nome" required placeholder="Digite seu nome">
    </div>

    <div class="form-group">
      <label for="campo-telefone">Telefone:</label>
      <input 
        type="tel" 
        id="campo-telefone" 
        name="telefone" 
        placeholder="(11) 99999-9999"
        pattern="\(\d{2}\) \d{4,5}-\d{4}" 
        required
      >
    </div>

    <div class="form-group">
      <label for="campo-email">E-mail:</label>
      <input type="email" id="campo-email" name="email" required placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label for="campo-senha">Senha:</label>
      <input type="password" id="campo-senha" name="senha" required minlength="6" placeholder="******">
    </div>

    <div class="form-group">
      <label for="campo-confirmar-senha">Confirmar Senha:</label>
      <input type="password" id="campo-confirmar-senha" name="confirmar_senha" required minlength="6" placeholder="******">
    </div>

    <button type="submit" class="btn-submit">Enviar</button>
    
    <button type="button" class="btn-submit" disabled>Botão Desabilitado</button>
  </form>

</body>
</html>
